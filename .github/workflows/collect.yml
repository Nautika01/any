name: collect

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # 15분마다 (정각은 GitHub 쪽이 붐벼서 피함)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python src/collect.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull -q --rebase
          git push -q
